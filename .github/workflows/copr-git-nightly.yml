name: COPR nightly rebuild for -git packages

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - uses: actions/checkout@v4

      - run: dnf install -y copr-cli findutils

      - run: |
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = ${{ secrets.COPR_USERNAME }}
          token = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"

          find . -mindepth 2 -maxdepth 2 -type f -path './*-git/*.spec' | sort | while read -r file; do
            copr-cli buildscm misc-packages \
              --clone-url "$REPO_URL" \
              --commit "${{ github.sha }}" \
              --subdir "$(dirname "$file")" \
              --spec "$(basename "$file")" \
              --nowait
          done
