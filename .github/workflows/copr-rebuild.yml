# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  rebuild:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container: fedora:latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      
      - name: Install copr-cli
        run: dnf install -y git copr-cli tar

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Get changed packages
        id: changed-files
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- '*.spec' || true)
          else
            echo "before SHA missing: $BEFORE_SHA"
            if git rev-parse --verify "${AFTER_SHA}^" >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only "${AFTER_SHA}^" "$AFTER_SHA" -- '*.spec' || true)
            else
              CHANGED=$(git ls-files '*.spec' || true)
            fi
          fi

          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Runs a set of commands using the runners shell
      - name: Configure copr-cli
        run: |
          test -n "${{ secrets.COPR_LOGIN }}" || { echo "COPR_LOGIN is not set"; exit 1; }
          test -n "${{ secrets.COPR_USERNAME }}" || { echo "COPR_USERNAME is not set"; exit 1; }
          test -n "${{ secrets.COPR_TOKEN }}" || { echo "COPR_TOKEN is not set"; exit 1; }

          mkdir -p ~/.config
          {
            echo "[copr-cli]"
            echo "login = ${{ secrets.COPR_LOGIN }}"
            echo "username = ${{ secrets.COPR_USERNAME }}"
            echo "token = ${{ secrets.COPR_TOKEN }}"
            echo "copr_url = https://copr.fedorainfracloud.org"
          } > ~/.config/copr

      - name: Rebuild in Copr
        run: |
          if [ -z "${{ steps.changed-files.outputs.files }}" ]; then
            echo "No changed spec files"
            exit 0
          fi

          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
          REF_NAME="${{ github.ref_name }}"

          for file in ${{ steps.changed-files.outputs.files }}; do
            spec="$(basename "$file")"
            subdir="$(dirname "$file")"

            if [ "$subdir" = "." ]; then
              copr-cli buildscm misc-packages \
                --clone-url "$REPO_URL" \
                --commit "$REF_NAME" \
                --spec "$spec" \
                --nowait
            else
              copr-cli buildscm misc-packages \
                --clone-url "$REPO_URL" \
                --commit "$REF_NAME" \
                --subdir "$subdir" \
                --spec "$spec" \
                --nowait
            fi
          done
