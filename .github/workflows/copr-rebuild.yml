name: COPR rebuild on push

on:
  push:
    branches: [main]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - run: dnf install -y git copr-cli

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = ${{ secrets.COPR_USERNAME }}
          token = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"

          for file in $(git show --name-only --pretty='' "${{ github.sha }}" -- '*.spec'); do
            copr-cli buildscm misc-packages \
              --clone-url "$REPO_URL" \
              --commit "${{ github.sha }}" \
              --subdir "$(dirname "$file")" \
              --spec "$(basename "$file")" \
              --nowait
          done
