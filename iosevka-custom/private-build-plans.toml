# =====================================================================
# Iosevka 自定义构建计划 (License: OFL-1.1)
# 两种风格(ss08 / ss20-Curly) x 三种 spacing(fontconfig-mono / term / normal)
# 产物在 dist/。打包走 spec 里的 ttf:: 单次构建。
# =====================================================================

# ---------------------------------------------------------------------
# 风格一: ss08 (Pragmata Pro 风格) + 零/g/i 定制
# ---------------------------------------------------------------------
[buildPlans.IosevkaStar]
family = "Iosevka Star"
spacing = "fontconfig-mono"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

  [buildPlans.IosevkaStar.variants]
  inherits = "ss08"

    [buildPlans.IosevkaStar.variants.design]
    zero = "reverse-slashed"
    g = "single-storey-earless-corner"
    i = "serifed"

    [buildPlans.IosevkaStar.variants.italic]
    zero = "reverse-slashed"
    g = "single-storey-earless-corner"
    i = "serifed"

  [buildPlans.IosevkaStar.ligations]
  inherits = "clike"

[buildPlans.IosevkaStar.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaStar.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaStar.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaStar.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

